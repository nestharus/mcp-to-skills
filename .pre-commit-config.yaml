repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Lint Python files with Ruff and apply safe fixes on the fly.
      - id: ruff-check
        args: [--fix]
        types: [python]
        language_version: python3.14
      # Format Python files so commits match the configured Ruff style.
      - id: ruff-format
        types: [python]
        language_version: python3.14
