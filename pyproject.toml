[project]
name = "mcp-metadata-broker"
version = "0.1.0"
description = "FastAPI broker for retrieving MCP metadata descriptors."
readme = "README.md"
requires-python = ">=3.14.0,<3.15.0"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "orjson==3.11.4",
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0"
]

[project.scripts]
mcp-setup = "scripts.setup:main"
lint = "scripts.lint:main"
gen_openapi = "scripts.gen_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.5",
    "pre-commit>=4.4.0,<5",
    "checkov>=3.2.493,<4",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = []
